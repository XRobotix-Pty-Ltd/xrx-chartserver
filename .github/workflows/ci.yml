name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - nightly
  pull_request:
    branches:
      - master
      - nightly

env:
  DOCKER_IMAGE: xrobotix/xrx-chartserver

jobs:
  # Prebuild — rebuild base image only when heavy deps change
  docker-build-base:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        run: |
          git clone --depth=2 https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: Check for base dependency changes
        id: check_changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(Dockerfile\.base|api/requirements\.txt|renderer/package\.json|renderer/package-lock\.json)$'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        if: steps.check_changes.outputs.changed == 'true'
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push base image
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          docker build -f Dockerfile.base -t xrobotix/xrx-chartserver:BASE_1 .
          docker push xrobotix/xrx-chartserver:BASE_1

  # Build main application image
  docker-build:
    runs-on: ubuntu-latest
    needs: [docker-build-base]
    if: always() && github.event_name == 'push' && (needs.docker-build-base.result == 'success' || needs.docker-build-base.result == 'skipped')
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - name: Checkout code
        run: git clone --depth=1 https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git .

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        id: build
        env:
          CI_COMMIT_BRANCH: ${{ github.ref_name }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_COMMIT_AUTHOR: ${{ github.actor }}
          CI_COMMIT_AUTHOR_EMAIL: ${{ github.event.pusher.email }}
          CI_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          CI_COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          SHORT_SHA=${CI_COMMIT_SHA:0:8}
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          if [[ "$CI_COMMIT_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            tag=":latest"
            docker build \
              --build-arg CI_COMMIT_BRANCH="$CI_COMMIT_BRANCH" \
              --build-arg CI_COMMIT_SHA="$CI_COMMIT_SHA" \
              --build-arg CI_COMMIT_AUTHOR="$CI_COMMIT_AUTHOR" \
              --build-arg CI_COMMIT_AUTHOR_EMAIL="$CI_COMMIT_AUTHOR_EMAIL" \
              --build-arg CI_COMMIT_MESSAGE="$CI_COMMIT_MESSAGE" \
              --build-arg CI_COMMIT_TIMESTAMP="$CI_COMMIT_TIMESTAMP" \
              -t "${{ env.DOCKER_IMAGE }}${tag}" \
              -t "${{ env.DOCKER_IMAGE }}${tag}.${SHORT_SHA}" .
            docker push "${{ env.DOCKER_IMAGE }}${tag}.${SHORT_SHA}"
            docker push "${{ env.DOCKER_IMAGE }}${tag}"
            echo "image_tag=latest.${SHORT_SHA}" >> $GITHUB_OUTPUT
          else
            tag=":$CI_COMMIT_BRANCH"
            docker build \
              --build-arg CI_COMMIT_BRANCH="$CI_COMMIT_BRANCH" \
              --build-arg CI_COMMIT_SHA="$CI_COMMIT_SHA" \
              --build-arg CI_COMMIT_AUTHOR="$CI_COMMIT_AUTHOR" \
              --build-arg CI_COMMIT_AUTHOR_EMAIL="$CI_COMMIT_AUTHOR_EMAIL" \
              --build-arg CI_COMMIT_MESSAGE="$CI_COMMIT_MESSAGE" \
              --build-arg CI_COMMIT_TIMESTAMP="$CI_COMMIT_TIMESTAMP" \
              -t "${{ env.DOCKER_IMAGE }}${tag}.${SHORT_SHA}" .
            docker push "${{ env.DOCKER_IMAGE }}${tag}.${SHORT_SHA}"
            echo "image_tag=${CI_COMMIT_BRANCH}.${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

  # Run tests inside the built container
  docker-test:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push'
    steps:
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Run tests
        env:
          CI_COMMIT_BRANCH: ${{ github.ref_name }}
          CI_COMMIT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA=${CI_COMMIT_SHA:0:8}
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          if [[ "$CI_COMMIT_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            tag=":latest"
          else
            tag=":$CI_COMMIT_BRANCH"
          fi

          docker pull "${{ env.DOCKER_IMAGE }}${tag}.${SHORT_SHA}"
          docker run --rm "${{ env.DOCKER_IMAGE }}${tag}.${SHORT_SHA}" \
            python3 -m pytest api/tests/ -v

  # Security scan with Trivy (non-blocking)
  trivy-scan:
    runs-on: ubuntu-latest
    needs: docker-test
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - name: Run Trivy vulnerability scanner
        env:
          CI_COMMIT_BRANCH: ${{ github.ref_name }}
          CI_COMMIT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA=${CI_COMMIT_SHA:0:8}
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          if [[ "$CI_COMMIT_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            tag="latest"
          else
            tag="$CI_COMMIT_BRANCH"
          fi

          IMAGE_REF="${{ env.DOCKER_IMAGE }}:${tag}.${SHORT_SHA}"
          echo "Scanning image: $IMAGE_REF"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --format table \
            --exit-code 0 \
            --ignore-unfixed \
            --vuln-type os,library \
            --severity CRITICAL,HIGH \
            "$IMAGE_REF"

  # PR builds — build + test only, no push
  pr-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        run: git clone --depth=1 https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git .

      - name: Build image (no push)
        run: docker build -t xrx-chartserver-pr-${{ github.event.pull_request.number }} .

      - name: Run tests
        run: |
          docker run --rm xrx-chartserver-pr-${{ github.event.pull_request.number }} \
            python3 -m pytest api/tests/ -v

      - name: Cleanup PR image
        if: always()
        run: docker rmi xrx-chartserver-pr-${{ github.event.pull_request.number }} || true
